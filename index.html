<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>피규어 3D 뷰어</title>
<style>
  html,body{margin:0;height:100%;background:#111318;color:#e8eaf1;font-family:system-ui,"Apple SD Gothic Neo",sans-serif;overflow:hidden}
  #app{position:fixed;inset:0}
  #panel{position:fixed;left:12px;top:12px;max-width:min(340px,calc(100vw - 24px));background:rgba(20,22,30,.82);border:1px solid #2c3142;border-radius:10px;padding:10px 12px;font-size:13px;line-height:1.6;backdrop-filter:blur(6px)}
  #panel b{color:#ef6d9b}
  #steps{list-style:none;margin:6px 0;padding:0}
  #steps li::before{content:"○ ";color:#666}
  #steps li.done::before{content:"● ";color:#4cc08a}
  #steps li.err::before{content:"✕ ";color:#e46b6b}
  button{background:#2f3650;color:#fff;border:0;border-radius:6px;padding:6px 10px;font-size:13px;cursor:pointer}
  button:focus-visible{outline:2px solid #ef6d9b}
  #drop{position:fixed;inset:0;display:none;align-items:center;justify-content:center;background:rgba(239,109,155,.18);font-size:20px;pointer-events:none}
  #drop.on{display:flex}
</style>
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/",
  "@sparkjsdev/spark": "https://sparkjs.dev/releases/spark/2.4.0/spark.module.js"
} }
</script>
</head>
<body>
<div id="app"></div>
<div id="panel">
  <div><b>피규어 3D 뷰어</b> · 끌어서 회전, 휠/두 손가락으로 확대</div>
  <ul id="steps">
    <li id="s-lib">라이브러리 불러오기</li>
    <li id="s-ren">렌더러 넣기</li>
    <li id="s-get">파일 받기</li>
    <li id="s-dec">알갱이로 풀기</li>
    <li id="s-box">크기 재기</li>
  </ul>
  <div id="info">-</div>
  <div style="margin-top:6px;display:flex;gap:6px;flex-wrap:wrap">
    <button id="flip">위아래 뒤집기</button>
    <button id="reset">처음 시점</button>
  </div>
  <div style="margin-top:6px;color:#9aa2b5">.sog / .spz / .ply 파일을 끌어다 놓으면 바꿔서 비교할 수 있습니다.</div>
</div>
<div id="drop">여기에 놓기</div>

<script type="module">
const SCENE_FILE = 'scene.sog';   // ← 장면 파일 이름은 여기서 바꿉니다
const HOME_VIEW = { pos: [3.063, 0.859, -1.618], target: [-1.775, -0.426, -1.989] };  // 촬영 카메라 기준 시작 시점

const $ = (id) => document.getElementById(id);
const step = (id, ok = true) => $(id).className = ok ? 'done' : 'err';
const TYPE = { 'sog': 'pcsogszip', 'spz': 'spz', 'ply': 'ply', 'splat': 'splat', 'ksplat': 'ksplat' };
const typeOf = (name) => {
  const n = name.toLowerCase();
  if (n.endsWith('.compressed.ply') || n.endsWith('.ply')) return 'ply';
  return TYPE[n.split('.').pop()];
};

let THREE, OrbitControls, SparkRenderer, SplatMesh;
try {
  THREE = await import('three');
  ({ OrbitControls } = await import('three/addons/controls/OrbitControls.js'));
  ({ SparkRenderer, SplatMesh } = await import('@sparkjsdev/spark'));
  step('s-lib');
} catch (e) { step('s-lib', false); $('info').textContent = '라이브러리를 못 불러왔습니다: ' + e.message; throw e; }

const renderer = new THREE.WebGLRenderer({ antialias: false });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
$('app').appendChild(renderer.domElement);
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x111318);
const camera = new THREE.PerspectiveCamera(62, innerWidth / innerHeight, 0.01, 1000);
const spark = new SparkRenderer({ renderer });
scene.add(spark);
step('s-ren');

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true; controls.dampingFactor = 0.08;

let mesh = null, home = null;
async function load(bytes, name, sizeLabel, ms) {
  ['s-dec', 's-box'].forEach(i => $(i).className = '');
  if (mesh) { scene.remove(mesh); mesh.dispose?.(); }
  mesh = new SplatMesh({ fileBytes: bytes, fileType: typeOf(name), fileName: name });
  scene.add(mesh);
  await mesh.initialized;
  step('s-dec');
  const n = mesh.packedSplats?.numSplats ?? mesh.numSplats ?? '?';
  const box = mesh.getBoundingBox(true);
  const c = box.getCenter(new THREE.Vector3()), s = box.getSize(new THREE.Vector3());
  const r = Math.max(s.x, s.y, s.z);
  if (name === SCENE_FILE && HOME_VIEW) {
    // 사진 00.jpg를 찍은 카메라 위치에서 시작
    camera.position.fromArray(HOME_VIEW.pos);
    controls.target.fromArray(HOME_VIEW.target);
  } else {
    controls.target.copy(c);
    camera.position.copy(c).add(new THREE.Vector3(0, r * 0.15, -r * 0.9));
  }
  camera.near = r / 500; camera.far = r * 50; camera.updateProjectionMatrix();
  home = { p: camera.position.clone(), t: c.clone() };
  step('s-box');
  $('info').innerHTML = `${name}<br>파일 ${sizeLabel} · 받기 ${ms} ms · 알갱이 ${Number(n).toLocaleString()}개`;
}
const fmt = (b) => b > 1048576 ? (b / 1048576).toFixed(2) + ' MB' : (b / 1024).toFixed(1) + ' KB';

try {
  const t0 = performance.now();
  const res = await fetch(SCENE_FILE);
  if (!res.ok) throw new Error(res.status + ' ' + res.statusText);
  const bytes = new Uint8Array(await res.arrayBuffer());
  const ms = Math.round(performance.now() - t0);
  step('s-get');
  await load(bytes, SCENE_FILE, fmt(bytes.length), ms);
} catch (e) { $('info').textContent = '장면을 못 열었습니다: ' + e.message; console.error(e); }

$('flip').onclick = () => { if (mesh) { mesh.rotation.x += Math.PI; } };
$('reset').onclick = () => { if (home) { camera.position.copy(home.p); controls.target.copy(home.t); } };

addEventListener('dragover', (e) => { e.preventDefault(); $('drop').classList.add('on'); });
addEventListener('dragleave', () => $('drop').classList.remove('on'));
addEventListener('drop', async (e) => {
  e.preventDefault(); $('drop').classList.remove('on');
  const f = e.dataTransfer.files[0]; if (!f) return;
  const t0 = performance.now();
  const bytes = new Uint8Array(await f.arrayBuffer());
  await load(bytes, f.name, fmt(f.size), Math.round(performance.now() - t0));
});

addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});
renderer.setAnimationLoop(() => { controls.update(); renderer.render(scene, camera); });
</script>
</body>
</html>
